# Пример виртуального хоста nginx перед сервисом.
# Замените имя сервера и пути к сертификатам на корпоративные.

server {
    listen 443 ssl http2;
    server_name pdf2word.corp.local;

    ssl_certificate     /etc/nginx/certs/pdf2word.crt;
    ssl_certificate_key /etc/nginx/certs/pdf2word.key;

    # PDF до 100 МБ (MAX_FILE_MB) + запас на multipart
    client_max_body_size 110m;

    # Вариант с доменной авторизацией через oauth2-proxy (Keycloak / ADFS / Azure AD):
    # location /oauth2/ { proxy_pass http://127.0.0.1:4180; }
    # location = /oauth2/auth { proxy_pass http://127.0.0.1:4180; proxy_pass_request_body off; proxy_set_header Content-Length ""; }
    # и в location / ниже: auth_request /oauth2/auth; error_page 401 = /oauth2/sign_in;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;   # загрузка большого файла идёт сразу в приложение
    }
}

server {
    listen 80;
    server_name pdf2word.corp.local;
    return 301 https://$host$request_uri;
}
