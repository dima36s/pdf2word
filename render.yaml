# Блюпринт Render: постоянная ссылка на бесплатном тарифе.
# Кнопка «Deploy to Render» в README создаёт сервис по этому файлу.
#
# Бесплатный тариф: 512 МБ памяти и 0,1 CPU, засыпает после 15 минут без запросов
# (первый запрос после сна — около минуты). Текстовые PDF конвертируются нормально,
# а распознаванию сканов нужно ~600 МБ памяти — поэтому здесь OCR выключен.
# Полная версия с OCR — в GitHub Codespaces или на своём сервере.
services:
  - type: web
    name: pdf2word
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: OCR_ENABLED
        value: "0"
      - key: CONVERT_WORKERS
        value: "1"
      - key: MAX_FILE_MB
        value: "30"
      - key: MAX_PAGES
        value: "100"
      - key: FILE_TTL_MIN
        value: "30"
      - key: CONVERT_TIMEOUT
        value: "600"
      - key: DEMO_NOTICE
        value: "Тестовый стенд: не загружайте конфиденциальные документы, файлы удаляются через 30 минут. Распознавание сканов здесь отключено. После простоя первая загрузка страницы занимает около минуты."
